<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>VoiceFlow AI Translator</title>

    <!-- Google Font -->
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: "Poppins", sans-serif;
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        background: linear-gradient(
          135deg,
          #0f172a,
          #1e293b,
          #312e81,
          #7c3aed
        );
        padding: 20px;
        overflow: hidden;
      }

      body::before,
      body::after {
        content: "";
        position: absolute;
        width: 350px;
        height: 350px;
        border-radius: 50%;
        filter: blur(90px);
        z-index: -1;
      }

      body::before {
        background: #7c3aed;
        top: -100px;
        left: -100px;
      }

      body::after {
        background: #06b6d4;
        bottom: -100px;
        right: -100px;
      }

      .card {
        width: 100%;
        max-width: 500px;
        background: rgba(255, 255, 255, 0.12);
        backdrop-filter: blur(18px);
        border: 1px solid rgba(255, 255, 255, 0.15);
        border-radius: 24px;
        padding: 30px;
        box-shadow: 0 10px 40px rgba(0, 0, 0, 0.35);
        color: white;
        animation: fadeIn 1s ease;
      }

      @keyframes fadeIn {
        from {
          opacity: 0;
          transform: translateY(20px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      .logo {
        width: 75px;
        height: 75px;
        margin: auto;
        border-radius: 50%;
        background: linear-gradient(135deg, #06b6d4, #7c3aed);
        display: flex;
        justify-content: center;
        align-items: center;
        font-size: 30px;
        margin-bottom: 18px;
        box-shadow: 0 0 25px rgba(124, 58, 237, 0.5);
      }

      h1 {
        text-align: center;
        font-size: 2rem;
        margin-bottom: 10px;
      }

      .subtitle {
        text-align: center;
        font-size: 14px;
        color: #d1d5db;
        margin-bottom: 25px;
      }

      textarea {
        width: 100%;
        height: 140px;
        border: none;
        outline: none;
        resize: none;
        border-radius: 16px;
        padding: 15px;
        font-size: 15px;
        font-family: "Poppins", sans-serif;
        background: rgba(255, 255, 255, 0.12);
        color: white;
        margin-bottom: 18px;
      }

      textarea::placeholder {
        color: #d1d5db;
      }

      .controls {
        display: flex;
        flex-direction: column;
        gap: 15px;
      }

      select,
      input[type="range"] {
        width: 100%;
        padding: 12px;
        border-radius: 12px;
        border: none;
        outline: none;
        font-family: "Poppins", sans-serif;
        background: rgba(255, 255, 255, 0.12);
        color: white;
      }

      option {
        color: black;
      }

      .range-box {
        color: #e5e7eb;
        font-size: 14px;
      }

      .translated-box {
        margin-top: 18px;
        padding: 14px;
        border-radius: 14px;
        background: rgba(255, 255, 255, 0.1);
        min-height: 70px;
        color: #f3f4f6;
        font-size: 14px;
      }

      .buttons {
        display: flex;
        gap: 12px;
        margin-top: 15px;
      }

      button {
        flex: 1;
        padding: 14px;
        border: none;
        border-radius: 14px;
        font-size: 15px;
        font-weight: 600;
        cursor: pointer;
        transition: 0.3s ease;
      }

      #translateBtn {
        background: linear-gradient(135deg, #06b6d4, #7c3aed);
        color: white;
      }

      #stopBtn {
        background: rgba(255, 255, 255, 0.15);
        color: white;
      }

      button:hover {
        transform: translateY(-2px);
        opacity: 0.95;
      }

      #msg {
        text-align: center;
        margin-top: 18px;
        color: #e5e7eb;
        font-size: 14px;
      }

      .footer {
        text-align: center;
        margin-top: 22px;
        font-size: 14px;
        color: #d1d5db;
      }

      .heart {
        color: #ef4444;
      }

      @media (max-width: 500px) {
        .card {
          padding: 22px;
        }

        h1 {
          font-size: 1.7rem;
        }

        .buttons {
          flex-direction: column;
        }
      }
    </style>
  </head>

  <body>
    <div class="card">
      <div class="logo">🎙️</div>

      <h1>VoiceFlow AI</h1>

      <p class="subtitle">
        Translate text into different languages and hear natural speech.
      </p>

      <textarea
        id="text"
        placeholder="Type your text here..."
      ></textarea>

      <div class="controls">
        <select id="languageSelect">
          <option value="te">Telugu</option>
          <option value="hi">Hindi</option>
          <option value="fr">French</option>
          <option value="es">Spanish</option>
          <option value="de">German</option>
          <option value="ja">Japanese</option>
        </select>

        <div class="range-box">
          Speech Speed:
          <span id="speedValue">1</span>
        </div>

        <input
          type="range"
          id="speed"
          min="0.5"
          max="2"
          step="0.1"
          value="1"
        />
      </div>

      <div class="translated-box" id="translatedText">
        Translated text will appear here...
      </div>

      <div class="buttons">
        <button id="translateBtn">Translate & Speak</button>
        <button id="stopBtn">Stop</button>
      </div>

      <p id="msg"></p>

      <div class="footer">
        Made with <span class="heart">❤️</span> by Dhanya Akshaya
      </div>
    </div>

    <script>
      const textArea = document.getElementById("text");
      const translateBtn = document.getElementById("translateBtn");
      const stopBtn = document.getElementById("stopBtn");
      const translatedText = document.getElementById("translatedText");
      const languageSelect = document.getElementById("languageSelect");
      const msg = document.getElementById("msg");
      const speed = document.getElementById("speed");
      const speedValue = document.getElementById("speedValue");

      // Speed Display
      speed.addEventListener("input", () => {
        speedValue.textContent = speed.value;
      });

      // Translate and Speak
      translateBtn.addEventListener("click", async () => {
        const text = textArea.value.trim();

        if (text === "") {
          msg.textContent = "Please enter some text.";
          return;
        }

        const targetLang = languageSelect.value;

        msg.textContent = "Translating...";

        try {
          // LibreTranslate API
          const response = await fetch(
            "https://libretranslate.de/translate",
            {
              method: "POST",
              headers: {
                "Content-Type": "application/json",
              },
              body: JSON.stringify({
                q: text,
                source: "en",
                target: targetLang,
                format: "text",
              }),
            }
          );

          const data = await response.json();

          const translated = data.translatedText;

          translatedText.textContent = translated;

          msg.textContent = "Speaking translated text...";

          // Speak translated text
          const utterance = new SpeechSynthesisUtterance(translated);

          utterance.rate = speed.value;
          utterance.lang = targetLang;

          speechSynthesis.cancel();
          speechSynthesis.speak(utterance);

          utterance.onend = () => {
            msg.textContent = "Finished speaking.";
          };
        } catch (error) {
          console.log(error);
          msg.textContent =
            "Translation failed. Please try again later.";
        }
      });

      // Stop speech
      stopBtn.addEventListener("click", () => {
        speechSynthesis.cancel();
        msg.textContent = "Speech stopped.";
      });
    </script>
  </body>
</html>
