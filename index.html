<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>VoiceFlow | Text to Speech</title>

    <!-- Google Font -->
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: "Poppins", sans-serif;
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        background: linear-gradient(
          135deg,
          #0f172a,
          #1e293b,
          #312e81,
          #7c3aed
        );
        padding: 20px;
        overflow: hidden;
      }

      /* Background Glow */
      body::before,
      body::after {
        content: "";
        position: absolute;
        width: 350px;
        height: 350px;
        border-radius: 50%;
        filter: blur(90px);
        z-index: -1;
      }

      body::before {
        background: #7c3aed;
        top: -100px;
        left: -100px;
      }

      body::after {
        background: #06b6d4;
        bottom: -100px;
        right: -100px;
      }

      .card {
        width: 100%;
        max-width: 460px;
        background: rgba(255, 255, 255, 0.12);
        backdrop-filter: blur(18px);
        border: 1px solid rgba(255, 255, 255, 0.15);
        border-radius: 24px;
        padding: 30px;
        box-shadow: 0 10px 40px rgba(0, 0, 0, 0.35);
        color: white;
        animation: fadeIn 1s ease;
      }

      @keyframes fadeIn {
        from {
          opacity: 0;
          transform: translateY(20px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      .logo {
        width: 70px;
        height: 70px;
        margin: auto;
        border-radius: 50%;
        background: linear-gradient(135deg, #06b6d4, #7c3aed);
        display: flex;
        justify-content: center;
        align-items: center;
        font-size: 28px;
        margin-bottom: 18px;
        box-shadow: 0 0 25px rgba(124, 58, 237, 0.5);
      }

      h1 {
        text-align: center;
        font-size: 2rem;
        margin-bottom: 10px;
      }

      .subtitle {
        text-align: center;
        font-size: 14px;
        color: #d1d5db;
        margin-bottom: 25px;
      }

      textarea {
        width: 100%;
        height: 140px;
        border: none;
        outline: none;
        resize: none;
        border-radius: 16px;
        padding: 15px;
        font-size: 15px;
        font-family: "Poppins", sans-serif;
        background: rgba(255, 255, 255, 0.12);
        color: white;
        margin-bottom: 18px;
      }

      textarea::placeholder {
        color: #d1d5db;
      }

      .controls {
        display: flex;
        flex-direction: column;
        gap: 15px;
      }

      select,
      input[type="range"] {
        width: 100%;
        padding: 12px;
        border-radius: 12px;
        border: none;
        outline: none;
        font-family: "Poppins", sans-serif;
        background: rgba(255, 255, 255, 0.12);
        color: white;
      }

      option {
        color: black;
      }

      .range-box {
        color: #e5e7eb;
        font-size: 14px;
      }

      .buttons {
        display: flex;
        gap: 12px;
        margin-top: 10px;
        flex-wrap: wrap;
      }

      button {
        flex: 1;
        min-width: 120px;
        padding: 14px;
        border: none;
        border-radius: 14px;
        font-size: 15px;
        font-weight: 600;
        cursor: pointer;
        transition: 0.3s ease;
      }

      #speakBtn {
        background: linear-gradient(135deg, #06b6d4, #7c3aed);
        color: white;
      }

      #pauseBtn {
        background: rgba(255, 255, 255, 0.15);
        color: white;
      }

      #resumeBtn {
        background: rgba(255, 255, 255, 0.15);
        color: white;
      }

      button:hover {
        transform: translateY(-2px);
        opacity: 0.95;
      }

      #msg {
        text-align: center;
        margin-top: 18px;
        color: #e5e7eb;
        font-size: 14px;
      }

      .footer {
        text-align: center;
        margin-top: 22px;
        font-size: 14px;
        color: #d1d5db;
      }

      .heart {
        color: #ef4444;
      }

      @media (max-width: 500px) {
        .card {
          padding: 22px;
        }

        h1 {
          font-size: 1.7rem;
        }

        .buttons {
          flex-direction: column;
        }
      }
    </style>
  </head>

  <body>
    <div class="card">
      <div class="logo">🎙️</div>

      <h1>VoiceFlow</h1>

      <p class="subtitle">
        Convert your text into natural speech with multiple voices.
      </p>

      <textarea
        id="text"
        placeholder="Type something here..."
      ></textarea>

      <div class="controls">
        <select id="voiceSelect">
          <option value="">Select Voice</option>
        </select>

        <div class="range-box">
          Speech Speed:
          <span id="speedValue">1</span>
        </div>

        <input
          type="range"
          id="speed"
          min="0.5"
          max="2"
          step="0.1"
          value="1"
        />
      </div>

      <div class="buttons">
        <button id="speakBtn">Speak</button>
        <button id="pauseBtn">Pause</button>
        <button id="resumeBtn">Resume</button>
      </div>

      <p id="msg"></p>

      <div class="footer">
        Made with <span class="heart">❤️</span> by Dhanya Akshaya
      </div>
    </div>

    <script>
      const textArea = document.getElementById("text");
      const speakBtn = document.getElementById("speakBtn");
      const pauseBtn = document.getElementById("pauseBtn");
      const resumeBtn = document.getElementById("resumeBtn");
      const msg = document.getElementById("msg");
      const voiceSelect = document.getElementById("voiceSelect");
      const speed = document.getElementById("speed");
      const speedValue = document.getElementById("speedValue");

      let voices = [];
      let currentUtterance;

      // Load voices
      function loadVoices() {
        voices = speechSynthesis.getVoices();

        voiceSelect.innerHTML =
          '<option value="">Select Voice</option>';

        voices.forEach((voice, index) => {
          const option = document.createElement("option");

          option.value = index;
          option.textContent = `${voice.name} (${voice.lang})`;

          voiceSelect.appendChild(option);
        });
      }

      loadVoices();

      speechSynthesis.onvoiceschanged = loadVoices;

      // Update speed display
      speed.addEventListener("input", () => {
        speedValue.textContent = speed.value;
      });

      // Speak
      speakBtn.addEventListener("click", () => {
        const text = textArea.value.trim();

        if (!("speechSynthesis" in window)) {
          msg.textContent =
            "Speech synthesis is not supported in this browser.";
          return;
        }

        if (text === "") {
          msg.textContent = "Please enter some text.";
          return;
        }

        // Stop any previous speech
        speechSynthesis.cancel();

        currentUtterance = new SpeechSynthesisUtterance(text);

        const selectedVoice = voiceSelect.value;

        if (selectedVoice !== "") {
          currentUtterance.voice = voices[selectedVoice];
        }

        currentUtterance.rate = speed.value;

        msg.textContent = "Speaking...";

        speechSynthesis.speak(currentUtterance);

        currentUtterance.onend = () => {
          msg.textContent = "Finished speaking.";
        };
      });

      // Pause speech
      pauseBtn.addEventListener("click", () => {
        speechSynthesis.pause();
        msg.textContent = "Speech paused.";
      });

      // Resume speech
      resumeBtn.addEventListener("click", () => {
        speechSynthesis.resume();
        msg.textContent = "Speech resumed.";
      });
    </script>
  </body>
</html>
